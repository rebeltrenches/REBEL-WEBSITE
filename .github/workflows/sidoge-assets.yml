name: Replace SIDOGE assets

on:
  push:
    paths:
      - '.github/workflows/sidoge-assets.yml'

permissions:
  contents: write

jobs:
  replace-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace SIDOGE logo and slideshow
        run: |
          set -e
          curl -fsSL 'https://api.github.com/repos/rebeltrenches/REBEL-WEBSITE/git/blobs/7dd1ab9f4344970f2a91ddb0fc99cb3f1e28bfb3' | jq -r '.content' | tr -d '\n' | base64 -d > sidoge/logo.jpg
          curl -fsSL 'https://api.github.com/repos/rebeltrenches/REBEL-WEBSITE/git/blobs/f4e43cfe0342cc60bbcf6408aae36f2247e9a232' | jq -r '.content' | tr -d '\n' | base64 -d > sidoge/slideshow.mp4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sidoge/logo.jpg sidoge/slideshow.mp4
          git commit -m 'Replace SIDOGE logo and slideshow only' || true
          git push